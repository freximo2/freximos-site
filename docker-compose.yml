# Sitios estáticos de freximos.com (nginx).
# Uso: docker-compose up -d   (en esta carpeta)
services:
  # Home de freximos.com
  site:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8081:80"

  # Página de "en construcción" para eventos.freximos.com mientras prod está apagado
  mantenimiento:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./mantenimiento:/usr/share/nginx/html:ro
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8083:80"

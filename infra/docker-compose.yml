# Sitios estáticos de freximos.com (nginx).
# Uso: docker-compose -f infra/docker-compose.yml up -d   (desde la raíz del repo)
services:
  # Home de freximos.com
  site:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../public:/usr/share/nginx/html:ro
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8081:80"

  # Página de "en construcción" para eventos.freximos.com mientras prod está apagado
  mantenimiento:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../maintenance:/usr/share/nginx/html:ro
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8083:80"
